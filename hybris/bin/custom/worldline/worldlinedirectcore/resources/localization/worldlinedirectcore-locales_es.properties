type.WorldlineConfiguration.exemptionType3DS.name=Tipo de exenci\u00f3n de seguridad 3D
type.WorldlineConfiguration.exemptionType3DS.description=Cuando se activa, se solicitar\u00e1 una exenci\u00f3n de 3DS para transacciones con un importe de pedido inferior al l\u00edmite configurado.Al activar la exenci\u00f3n de 3DS, permite que el emisor de la tarjeta y su entidad adquirente eval\u00faen el nivel de riesgo de las transacciones hasta el l\u00edmite de exenci\u00f3n que especifique en EUR. Si se cumplen los criterios, sus clientes quedar\u00e1n exentos de la autenticaci\u00f3n fuerte de clientes (SCA). Si su entidad adquirente rechaza la exenci\u00f3n y exige la SCA, se habla de una denegaci\u00f3n suave. En estos casos, intentaremos solicitar al cliente la SCA y reiniciaremos la transacci\u00f3n si el cliente se autentica correctamente.\nLa exenci\u00f3n de Bajo Valor es adecuada para transacciones por debajo del umbral monetario especificado de 30 EUR, permitiendo a estas transacciones de bajo valor un cambio para evitar la Autenticaci\u00f3n Fuerte de Cliente (SCA) y agilizar el proceso de pago.\nPor otro lado, la exenci\u00f3n de An\u00e1lisis de Riesgo de Transacci\u00f3n permite una evaluaci\u00f3n din\u00e1mica del riesgo para sus transacciones. El emisor de la tarjeta y su entidad adquirente evaluar\u00e1n la transacci\u00f3n en funci\u00f3n de diversos factores de riesgo, permitiendo que las transacciones de hasta un l\u00edmite de 100 EUR puedan acogerse a la exenci\u00f3n si se consideran de bajo riesgo.\nnHaga su selecci\u00f3n cuidadosamente para optimizar el equilibrio entre la experiencia del cliente y la seguridad de sus transacciones. Seleccione el tipo de exenci\u00f3n.
type.WorldlineConfiguration.exemptionLimit3DS.name=L\u00edmite de exenci\u00f3n de seguridad 3D
type.WorldlineConfiguration.exemptionLimit3DS.description=El l\u00edmite de exenci\u00f3n se especifica en EUR. If EUR is not configured, the 3DS exemption will not be applied, and the transaction will not have the exemption requested.\n\nAdditional Note: La DSP2 designa el euro como moneda base para determinar los l\u00edmites de exenci\u00f3n de otras monedas en el EEE. No obstante, cada regi\u00f3n puede decidir adaptar estos l\u00edmites, y las regiones no pertenecientes al EEE tambi\u00e9n pueden admitir solicitudes de exenci\u00f3n. Debido a estas complejidades, no podemos garantizar que la solicitud de exenci\u00f3n sea considerada por el emisor o su adquirente. Por favor, introduzca el l\u00edmite de importe (m\u00e1x. 30 EUR para Valor bajo y m\u00e1x. 100 EUR para An\u00e1lisis de riesgo de transacci\u00f3n).

