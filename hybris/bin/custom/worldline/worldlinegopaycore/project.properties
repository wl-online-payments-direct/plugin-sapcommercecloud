# worldlinegopaycore.key=value
# Specifies the location of the spring context file putted automatically to the global platform application context.
worldlinegopaycore.application-context=worldlinegopaycore-spring.xml
worldlinegopaycore.global-context=worldlinegopaycore-spring-cache.xml

# -----------------------------------------------------------------------
# DEPRECATED KEYS - do not reference these from new code.
# -----------------------------------------------------------------------
# Before the Worldline GoPay rename these keys were named worldline.direct.*.
# They are retained here purely so that an existing merchant override in
# local.properties keeps taking effect after upgrading. The canonical
# worldline.gopay.* keys below inherit from them, so a merchant who has set
# worldline.direct.api.connectTimeout needs no change on upgrade.
#
# Set the worldline.gopay.* key instead; it always wins if set explicitly.
# These aliases are scheduled for removal in a future major release.
# -----------------------------------------------------------------------
worldline.direct.api.authorizationType=V1HMAC
worldline.direct.api.connectTimeout=10000
worldline.direct.api.socketTimeout=10000
worldline.direct.api.maxConnections=10
worldline.direct.api.integrator=Worldline
worldline.direct.api.shoppingCartExtension.creator=Greenlight Commerce

# -----------------------------------------------------------------------
# Canonical keys
# -----------------------------------------------------------------------
worldline.gopay.api.authorizationType=${worldline.direct.api.authorizationType}
worldline.gopay.api.connectTimeout=${worldline.direct.api.connectTimeout}
worldline.gopay.api.socketTimeout=${worldline.direct.api.socketTimeout}
worldline.gopay.api.maxConnections=${worldline.direct.api.maxConnections}
worldline.gopay.api.integrator=${worldline.direct.api.integrator}

#Other Configuration
worldline.gopay.api.shoppingCartExtension.creator=${worldline.direct.api.shoppingCartExtension.creator}
worldline.gopay.api.shoppingCartExtension.extensionId=SAPCC/v${build.version} - Worldline GoPay
worldline.gopay.api.shoppingCartExtension.name=SAP Commerce Cloud Worldline GoPay Plugin
worldline.gopay.api.shoppingCartExtension.version=7.0
