type.WorldlineConfiguration.enableMandatory3DS.description=Faire en sorte que 3D Secure soit obligatoire pour tous les paiements par carte.
type.WorldlineConfiguration.exemptionType3DS.name=3D Secure Exemption Type
type.WorldlineConfiguration.exemptionType3DS.description=Lorsque cette option est activ\u00e9e, une exemption de 3DS sera demand\u00e9e pour les transactions dont le montant est inf\u00e9rieur \u00e0 la limite configur\u00e9e. En activant l'exemption de 3DS, vous permettez \u00e0 l'\u00e9metteur de la carte et \u00e0 votre acqu\u00e9reur d'\u00e9valuer le niveau de risque des transactions jusqu'\u00e0 la limite d'exemption que vous avez sp\u00e9cifi\u00e9e en EUR. Si les crit\u00e8res sont remplis, vos clients seront exempt\u00e9s de l'authentification forte du client (SCA). Si votre acqu\u00e9reur rejette l'exemption et exige la SCA, il s'agit d'un refus tacite. Dans ce cas, nous tenterons d'inviter le client \u00e0 s'authentifier et nous r\u00e9initialiserons la transaction si le client s'authentifie avec succ\u00e8s.\nL'exemption pour les transactions de faible valeur est adapt\u00e9e aux transactions inf\u00e9rieures au seuil mon\u00e9taire sp\u00e9cifi\u00e9 de 30 EUR, permettant \u00e0 ces transactions de faible valeur de contourner l'authentification forte du client (SCA) et de rationaliser le processus de paiement.\nPar ailleurs, l'exemption pour l'analyse des risques li\u00e9s aux transactions permet une \u00e9valuation dynamique des risques li\u00e9s \u00e0 vos transactions. L'\u00e9metteur de la carte et votre acqu\u00e9reur \u00e9valueront la transaction sur la base de divers facteurs de risque, permettant aux transactions d'une valeur maximale de 100 EUR de b\u00e9n\u00e9ficier d'une exemption si elles sont consid\u00e9r\u00e9es comme pr\u00e9sentant un faible risque. Veuillez s\u00e9lectionner le type d'exemption.
type.WorldlineConfiguration.exemptionLimit3DS.name=3D Secure Exemption Limit
type.WorldlineConfiguration.exemptionLimit3DS.description=La limite d'exemption est sp\u00e9cifi\u00e9e en EUR. Si EUR n'est pas configur\u00e9, l'exemption 3DS ne sera pas appliqu\u00e9e et la transaction ne b\u00e9n\u00e9ficiera pas de l'exemption demand\u00e9e : La DSP2 d\u00e9signe l'euro comme monnaie de base pour d\u00e9terminer les limites d'exemption pour les autres monnaies dans l'EEE. Toutefois, chaque r\u00e9gion peut d\u00e9cider d'adapter ces limites, et les r\u00e9gions situ\u00e9es en dehors de l'EEE peuvent \u00e9galement soutenir les demandes d'exemption. En raison de ces complexit\u00e9s, nous ne pouvons pas garantir que la demande d'exemption sera prise en compte par l'\u00e9metteur ou votre acqu\u00e9reur. Veuillez indiquer le montant limite (max. 30 EUR pour la valeur faible et max. 100 EUR pour l'analyse du risque de transaction).

