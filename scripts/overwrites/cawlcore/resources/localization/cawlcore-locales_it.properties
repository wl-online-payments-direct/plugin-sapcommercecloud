type.WorldlineConfiguration.enable3DS.name=Abilita 3D Secure
type.WorldlineConfiguration.enable3DS.description=Se abilitare 3D Secure per i pagamenti con carta.
type.WorldlineConfiguration.enableMandatory3DS.name=Abilita 3D Secure obbligatorio
type.WorldlineConfiguration.enableMandatory3DS.description=Se rendere obbligatorio il 3D Secure per tutti i pagamenti con carta.
type.WorldlineConfiguration.exemptionType3DS.name=Tipo di esenzione 3D Secure
type.WorldlineConfiguration.exemptionType3DS.description=Se abilitata, verrà richiesta un'esenzione da 3DS per le transazioni con un importo dell'ordine inferiore al limite configurato. Abilitando l'esenzione 3DS, consenti all'emittente della carta e al tuo acquirente di valutare il livello di rischio delle transazioni fino al limite di esenzione specificato in EUR. Se i criteri vengono soddisfatti, i tuoi clienti saranno esentati dalla Strong Customer Authentication (SCA).\n\nSe il tuo acquirente rifiuta l'esenzione e richiede la SCA, si parla di un soft decline. In questi casi, proveremo a richiedere al cliente la SCA e a riavviare la transazione se l'autenticazione del cliente riesce.\n\nL'esenzione per importi bassi è adatta per le transazioni al di sotto della soglia monetaria specificata di 30 EUR, consentendo a queste transazioni di basso valore di aggirare la Strong Customer Authentication (SCA) e semplificare il processo di pagamento.\n\nD'altro canto, l'esenzione Transaction-Risk-Analysis consente una valutazione dinamica del rischio per le transazioni. L'emittente della carta e l'acquirente valuteranno la transazione in base a vari fattori di rischio, consentendo alle transazioni fino a un limite di 100 EUR di qualificarsi per l'esenzione se sono considerate a basso rischio.\n\nEffettua la tua scelta con attenzione per ottimizzare l'equilibrio tra esperienza del cliente e sicurezza delle tue transazioni. Selezionare il tipo di esenzione.
type.WorldlineConfiguration.exemptionLimit3DS.name=Limite di esenzione 3D Secure
type.WorldlineConfiguration.exemptionLimit3DS.description=Il limite di esenzione è specificato in EUR. Se EUR non è configurato, l'esenzione 3DS non verrà applicata e la transazione non avrà l'esenzione richiesta.\n\nNota aggiuntiva: La PSD2 designa l'EUR come valuta di base per determinare i limiti di esenzione per le altre valute dello SEE. Tuttavia, ogni regione può decidere di adattare tali limiti e anche le regioni al di fuori dello SEE possono supportare le richieste di esenzione. A causa di queste complessità, non possiamo garantire che la richiesta di esenzione verrà presa in considerazione dall'emittente o dal tuo acquirente. Inserisci il limite dell'importo (max 30 EUR per importi bassi e max 100 EUR per l'analisi del rischio di transazione).

