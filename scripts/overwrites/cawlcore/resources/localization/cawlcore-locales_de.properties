type.CAWLConfiguration.enableMandatory3DS.description=Ob 3D Secure für alle Kartenzahlungen obligatorisch sein soll.
type.CAWLConfiguration.exemptionType3DS.name=3D Secure Exemption Type
type.CAWLConfiguration.exemptionType3DS.description=Wenn aktiviert, wird eine Befreiung von 3DS für Transaktionen mit einem Auftragswert unterhalb des konfigurierten Limits angefordert.Wenn Sie die 3DS-Befreiung aktivieren, erlauben Sie dem Kartenaussteller und Ihrem Acquirer, das Risikoniveau von Transaktionen bis zu dem von Ihnen in EUR angegebenen Befreiungslimit zu bewerten. Wenn die Kriterien erfüllt sind, werden Ihre Kunden von der starken Kundenauthentifizierung (Strong Customer Authentication, SCA) befreit.\n\nWenn Ihr Acquirer die Befreiung ablehnt und SCA verlangt, wird dies als weiche Ablehnung bezeichnet. In solchen Fällen versuchen wir, den Kunden zur SCA aufzufordern und die Transaktion erneut zu initiieren, wenn der Kunde sich erfolgreich authentifiziert.\n\nDie Ausnahmeregelung für niedrige Werte eignet sich für Transaktionen unter dem festgelegten Schwellenwert von 30 EUR und ermöglicht es diesen Transaktionen mit niedrigen Werten, die starke Kundenauthentifizierung (Strong Customer Authentication, SCA) zu umgehen und den Bestellvorgang zu vereinfachen.\n\nDie Ausnahmeregelung für die Transaktions-Risikoanalyse ermöglicht dagegen eine dynamische Risikobewertung für Ihre Transaktionen. Der Kartenaussteller und Ihr Acquirer bewerten die Transaktion auf der Grundlage verschiedener Risikofaktoren, wobei Transaktionen bis zu einem Betrag von 100 EUR für eine Befreiung in Frage kommen, wenn sie als risikoarm eingestuft werden.\n\nWählen Sie sorgfältig aus, um ein optimales Gleichgewicht zwischen Kundenerfahrung und Sicherheit für Ihre Transaktionen zu erreichen. Bitte wählen Sie die Art der Befreiung aus.
type.CAWLConfiguration.exemptionLimit3DS.name=3D Secure Exemption Limit
type.CAWLConfiguration.exemptionLimit3DS.description=Die Freigrenze wird in EUR angegeben. Wenn EUR nicht konfiguriert ist, wird die 3DS-Befreiung nicht angewandt und die Transaktion erhält nicht die beantragte Befreiung.\n\nZusätzlicher Hinweis: Die PSD2 bestimmt den EUR als Basiswährung für die Festlegung von Freigrenzen für andere Währungen im EWR. Jede Region kann jedoch beschließen, diese Grenzen anzupassen, und auch Regionen außerhalb des EWR können Anträge auf Ausnahmen unterstützen. Aufgrund dieser Komplexität können wir nicht garantieren, dass der Antrag auf Befreiung vom Emittenten oder Ihrem Erwerber berücksichtigt wird. Bitte geben Sie die Betragsgrenze ein (max. 30 EUR für den niedrigen Wert und max. 100 EUR für die Transaktionsrisikoanalyse).

