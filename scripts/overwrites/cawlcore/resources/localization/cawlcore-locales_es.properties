type.CAWLConfiguration.exemptionType3DS.name=Tipo de exención de seguridad 3D
type.CAWLConfiguration.exemptionType3DS.description=Cuando se activa, se solicitará una exención de 3DS para transacciones con un importe de pedido inferior al límite configurado.Al activar la exención de 3DS, permite que el emisor de la tarjeta y su entidad adquirente evalúen el nivel de riesgo de las transacciones hasta el límite de exención que especifique en EUR. Si se cumplen los criterios, sus clientes quedarán exentos de la autenticación fuerte de clientes (SCA). Si su entidad adquirente rechaza la exención y exige la SCA, se habla de una denegación suave. En estos casos, intentaremos solicitar al cliente la SCA y reiniciaremos la transacción si el cliente se autentica correctamente.\nLa exención de Bajo Valor es adecuada para transacciones por debajo del umbral monetario especificado de 30 EUR, permitiendo a estas transacciones de bajo valor un cambio para evitar la Autenticación Fuerte de Cliente (SCA) y agilizar el proceso de pago.\nPor otro lado, la exención de Análisis de Riesgo de Transacción permite una evaluación dinámica del riesgo para sus transacciones. El emisor de la tarjeta y su entidad adquirente evaluarán la transacción en función de diversos factores de riesgo, permitiendo que las transacciones de hasta un límite de 100 EUR puedan acogerse a la exención si se consideran de bajo riesgo.\nnHaga su selección cuidadosamente para optimizar el equilibrio entre la experiencia del cliente y la seguridad de sus transacciones. Seleccione el tipo de exención.
type.CAWLConfiguration.exemptionLimit3DS.name=Límite de exención de seguridad 3D
type.CAWLConfiguration.exemptionLimit3DS.description=El límite de exención se especifica en EUR. If EUR is not configured, the 3DS exemption will not be applied, and the transaction will not have the exemption requested.\n\nAdditional Note: La DSP2 designa el euro como moneda base para determinar los límites de exención de otras monedas en el EEE. No obstante, cada región puede decidir adaptar estos límites, y las regiones no pertenecientes al EEE también pueden admitir solicitudes de exención. Debido a estas complejidades, no podemos garantizar que la solicitud de exención sea considerada por el emisor o su adquirente. Por favor, introduzca el límite de importe (máx. 30 EUR para Valor bajo y máx. 100 EUR para Análisis de riesgo de transacción).

