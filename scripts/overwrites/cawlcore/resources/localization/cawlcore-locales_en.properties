type.CAWLConfiguration.exemptionType3DS.name=3D Secure Exemption Type
type.CAWLConfiguration.exemptionType3DS.description=When enabled, an exemption from 3DS will be requested for transactions with an order amount below the configured limit.By enabling the 3DS Exemption, you allow the card issuer and your acquirer to evaluate the risk level of transactions up to the Exemption Limit you specify in EUR. If the criteria are met, your customers will be exempt from Strong Customer Authentication (SCA).\n\nIf your acquirer rejects the exemption and requires SCA, this is referred to as a soft decline. In such cases, we will attempt to prompt the customer for SCA and reinitiate the transaction if the customer successfully authenticates.\n\nThe Low-Value exemption is suitable for transactions below the specified monetary threshold of 30 EUR, allowing these low-value transactions a change to bypass Strong Customer Authentication (SCA) and streamline the checkout process.\n\nOn the other hand, the Transaction-Risk-Analysis exemption enables a dynamic risk assessment for your transactions. The card issuer and your acquirer will evaluate the transaction based on various risk factors, allowing transactions up to a limit of 100 EUR to qualify for exemption if they are deemed low risk.\n\nMake your selection carefully to optimize the balance between customer experience and security for your transactions. Please select the exemption type.
type.CAWLConfiguration.exemptionLimit3DS.name=3D Secure Exemption Limit
type.CAWLConfiguration.exemptionLimit3DS.description=The exemption limit is specified in EUR. If EUR is not configured, the 3DS exemption will not be applied, and the transaction will not have the exemption requested.\n\nAdditional Note: PSD2 designates the EUR as the base currency for determining exemption limits for other currencies in the EEA. However, each region can decide to adapt these limits, and regions outside the EEA may also support exemption requests. Due to these complexities, we cannot guarantee that the exemption request will be considered by the issuer or your acquirer. Please enter the amount limit (max 30 EUR for Low value and max 100 EUR for Transaction risk analysis).

