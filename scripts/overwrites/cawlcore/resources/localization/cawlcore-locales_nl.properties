type.WorldlineConfiguration.paymentModeSort.description=Invullen met een lijst om de betalingswijzen te sorteren die worden getoond tijdens het afrekenen. Let op: als de lijst niet leeg is, worden de resultaten van betalingsproducten bij het afrekenen beperkt tot de producten in deze lijst.
type.WorldlineConfiguration.enable3DS.name=Inschakelen 3D Secure
type.WorldlineConfiguration.enable3DS.description=Of 3D Secure voor kaartbetalingen moet worden ingeschakeld.
type.WorldlineConfiguration.enableMandatory3DS.name=Verplichte 3D-beveiliging inschakelen
type.WorldlineConfiguration.enableMandatory3DS.description=Wilt 3D Secure verplicht maken voor alle kaartbetalingen.
type.WorldlineConfiguration.exemptionType3DS.name=3D beveiligd vrijstellingstype
type.WorldlineConfiguration.exemptionType3DS.description=Ingeschakeld wordt een 3DS-vrijstelling aangevraagd voor transacties met een orderbedrag onder de geconfigureerde limiet. Door de 3DS-vrijstelling in te schakelen, geef je de kaartuitgever en je acquirer de mogelijkheid om het risiconiveau van transacties tot de door jou opgegeven vrijstellingslimiet in EUR te evalueren. Als aan de criteria wordt voldaan, zijn uw klanten vrijgesteld van SCA (Strong Customer Authentication). Als uw acquirer de vrijstelling afwijst en SCA vereist, wordt dit een soft decline genoemd. In dergelijke gevallen zullen we proberen de klant te vragen om SCA en de transactie opnieuw starten als de klant zich met succes heeft geauthenticeerd.\De uitzondering voor lage bedragen is geschikt voor transacties onder de gespecificeerde drempel van 30 EUR, waardoor deze transacties met een lage waarde de mogelijkheid hebben om Sterke Klantauthenticatie (SCA) te omzeilen en het afrekenproces te stroomlijnen.\Aan de andere kant maakt de uitzondering voor Transactie-risico-analyse een dynamische risicobeoordeling voor je transacties mogelijk. De kaartuitgever en je acquirer zullen de transactie evalueren op basis van verschillende risicofactoren, waardoor transacties tot een limiet van 100 EUR in aanmerking komen voor vrijstelling als ze als laag risico worden beschouwd. Selecteer het type vrijstelling.
type.WorldlineConfiguration.exemptionLimit3DS.name=3D Secure Exemption Limit
type.WorldlineConfiguration.exemptionLimit3DS.description=De vrijstellingslimiet wordt gespecificeerd in EUR. Als EUR niet is geconfigureerd, zal de 3DS vrijstelling niet worden toegepast, en zal de aangevraagde vrijstelling niet gelden voor de transactie: PSD2 wijst de EUR aan als de basisvaluta voor het bepalen van vrijstellingslimieten voor andere valuta in de EER. Elke regio kan echter besluiten om deze limieten aan te passen en regio's buiten de EER kunnen ook vrijstellingsverzoeken ondersteunen. Vanwege deze complexiteit kunnen we niet garanderen dat de vrijstellingsaanvraag door de emittent of uw acquirer in overweging zal worden genomen. Voer de limiet van het bedrag in (max 30 EUR voor Lage waarde en max 100 EUR voor Transactierisicoanalyse).

