# ==============================================================================
# CAWL Conversion Script - Configuration
# ==============================================================================
# This file is sourced by cawl.sh. Use shell-compatible key=value syntax.
# Lines starting with # are comments. Quote values containing spaces.

# ------------------------------------------------------------------------------
# SDK Configuration
# ------------------------------------------------------------------------------
# Configure the CAWL-branded SDK that replaces the Worldline SDK.
# The original Worldline SDK dependency is:
#   groupId:    com.worldline-solutions
#   artifactId: onlinepayments-sdk-java
#   version:    whatever worldlinegopaycore/external-dependencies.xml declares
#               (8.6.0 for release 7.0); cawl.sh detects this automatically
#   jar file:   lib/onlinepayments-sdk-java-<version>.jar
#
# Option A: Maven dependency (set coordinates, leave CAWL_SDK_JAR empty)
# Option B: Local jar file  (set CAWL_SDK_JAR to path, coordinates still
#           update the POM for consistency)
# Option C: Leave all empty to keep the original Worldline SDK as-is

CAWL_SDK_GROUP_ID='com.worldline-solutions'
CAWL_SDK_ARTIFACT_ID='onlinepayments-sdk-java'
# Leave empty to follow the version shipped by the source plugin (recommended).
# Pinning a different version here makes cawl.sh replace the jar via Maven.
CAWL_SDK_VERSION=
CAWL_SDK_JAR=
